name: Dev build

# Every push to main rebuilds the `dev` prerelease: the newest Frostfire for every platform, for
# testers. The builds are in build.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frostfire-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Frostfire.dmg Frostfire-macos.zip \
            Frostfire-windows-x64.zip Frostfire-windows-arm64.zip \
            Frostfire-linux-x64.tar.gz | tee SHA256SUMS.txt
      - name: Publish dev prerelease
        working-directory: dist
        run: |
          gh release delete dev --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create dev Frostfire.dmg Frostfire-macos.zip \
            Frostfire-windows-x64.zip Frostfire-windows-arm64.zip \
            Frostfire-linux-x64.tar.gz SHA256SUMS.txt \
            --prerelease --target "$GITHUB_SHA" --title "Dev build" \
            --notes "The newest build of main (${GITHUB_SHA::7}). Not a release: it may break."
