name: Release

# Push a tag like v0.1.0 to build Frostfire for macOS (one universal app for Apple
# silicon and Intel) and publish it as a GitHub release with a DMG and a zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build universal binary
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/frostfire \
            target/aarch64-apple-darwin/release/frostfire \
            target/x86_64-apple-darwin/release/frostfire
          lipo -info target/universal/frostfire
      - name: Bundle and package
        run: |
          FROSTFIRE_BIN=target/universal/frostfire scripts/bundle.sh
          scripts/package.sh
          shasum -a 256 dist/Frostfire.dmg dist/Frostfire-macos.zip | tee dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Frostfire.dmg dist/Frostfire-macos.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/Frostfire.dmg dist/Frostfire-macos.zip dist/SHA256SUMS.txt \
              --title "Frostfire $TAG" --generate-notes
          fi
