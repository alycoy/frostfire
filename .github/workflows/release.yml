name: Release

# Push a tag like v0.1.0 to build Frostfire for macOS (one universal app for Apple silicon and
# Intel), Windows (x64 and Arm64) and Linux (x64), and publish it as a GitHub release with every
# platform's downloads and SHA256SUMS.txt. The builds are in build.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      test: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frostfire-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Frostfire.dmg Frostfire-macos.zip \
            Frostfire-windows-x64.zip Frostfire-windows-arm64.zip \
            Frostfire-linux-x64.tar.gz | tee SHA256SUMS.txt
      - name: Publish release
        working-directory: dist
        run: |
          assets="Frostfire.dmg Frostfire-macos.zip Frostfire-windows-x64.zip Frostfire-windows-arm64.zip Frostfire-linux-x64.tar.gz SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
          else
            gh release create "$TAG" $assets --title "Frostfire $TAG" --generate-notes
          fi
