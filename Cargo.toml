[package]
name = "frostfire"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A native, GPU-rendered desktop app for every LG ThinQ appliance, built with Rune."
repository = "https://github.com/alycoy/frostfire"
readme = "README.md"
keywords = ["lg", "thinq", "smart-home", "desktop", "rune"]
categories = ["gui"]
publish = false

# Rune is pre-release: every Rune crate and every patch below pins the same `dev` revision.
# Cargo doesn't inherit a dependency's `[patch]`, so the crates Rune patches in its own
# workspace are patched here too (Rune's README, "Depending on Rune").
[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# HTTPS through the platform's TLS stack and trust store (Security.framework on macOS).
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
getrandom = "0.3"
zeroize = "1.8"
dirs = "6"

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The token lives in the login Keychain, never in a file.
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSApplication", "NSCell", "NSFont", "NSAttributedString", "NSImage"] }

[target.'cfg(all(not(target_vendor = "apple"), not(target_os = "windows")))'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The token lives in the Secret Service (GNOME Keyring, KWallet), reached over pure-Rust D-Bus:
# the same zbus 5 and async-io runtime Rune's accessibility already uses, so no libdbus.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["dx12"] }
# The token lives in Windows Credential Manager.
keyring-core = "1"
windows-native-keyring-store = { version = "1", default-features = false }

[build-dependencies]
# Frostfire.exe's icon and version info (build.rs, Windows targets only).
winresource = { version = "0.1", default-features = false }

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "bab9c8d9f4867565ef1737963ec8a9bc13eca10d" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
